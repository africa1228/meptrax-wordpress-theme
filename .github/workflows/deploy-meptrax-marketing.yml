name: Deploy MEPtrax Marketing Theme

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy MEPtrax theme to meptrax.com
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload theme to DreamHost
        timeout-minutes: 3
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_USER: ${{ secrets.DREAMHOST_USER }}
          DREAMHOST_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
        run: |
          lftp -u "$DREAMHOST_USER","$DREAMHOST_PASSWORD" "sftp://$DREAMHOST_HOST" -e "set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set sftp:auto-confirm yes; mirror --reverse --delete --verbose=1 theme/meptrax/ \"/home/tradulix/meptrax.com/wp-content/themes/meptrax/\"; bye"
